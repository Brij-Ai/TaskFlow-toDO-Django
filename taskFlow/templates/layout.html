{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Todo Home{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
<body class="bg-dark" style="font-family: Arial sans-serif; color: #6d6767">
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">

        <a class="navbar-brand fw-bold" href="{% url 'index' %}">
            🐦 TweetX
        </a>

        <div class="ms-auto">
            {% if user.is_authenticated %}
                <span class="text-bg-black me-3 gap-3"> Welcome {{ user.username }} 👤</span>
                <form action="{% url 'logout' %}" method="POST" class="d-inline">
                    {% csrf_token %}
                    <button class="btn btn-outline-danger">Logout </button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-outline-primary me-2">
                    Login
                </a>

                <a href="{% url 'register' %}" class="btn btn-primary">
                    Register
                </a>
            {% endif %} 
        </div>

    </div>
</nav>
    <div class="container">{% block content %} {% endblock %}</div>
</body>
</html>
