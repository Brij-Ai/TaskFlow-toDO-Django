{% extends 'home.html' %}
{% load static %}

{% block title %}
    {% if task %}
        Edit Task
    {% else %}
        Create Task
    {% endif %}
{% endblock %}

{% block content %}
    <div style="text-align: center; margin-top: 50px;">
        <h2>
            {% if task %}
                Edit Task
            {% else %}
                Create New Task
            {% endif %}
        </h2>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3 w-25 p-3" style="margin: 0 auto;">
                <label for="title" class="form-label">Title</label>
                <input type="text" class="form-control" id="title" name="title" maxlength="200" value="{{ task.title|default:'' }}" required>
            </div>

            <div class="mb-3 accordion w-25 p-3" style="margin: 0 auto;">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" name="description" rows="5">{{ task.description|default:'' }}</textarea>
            </div>

            <div class="mb-3 w-25 p-3" style="margin: 0 auto;">
                <label for="priority" class="form-label">Priority</label>
                <select class="form-control" id="priority" name="priority">
                    <option value="low" {% if task.priority == 'low' %}selected{% endif %}>Low</option>
                    <option value="medium" {% if task.priority == 'medium' or not task %}selected{% endif %}>Medium</option>
                    <option value="high" {% if task.priority == 'high' %}selected{% endif %}>High</option>
                </select>
            </div>

            <div class="mb-3 accordion w-25 p-3" style="margin: 0 auto;">
                <label for="due_date" class="form-label">Due Date</label>
                <input type="date" class="form-control" id="due_date" name="due_date" value="{{ task.due_date|date:'Y-m-d' }}">
            </div>

            <button type="submit" class="btn btn-success">
                {% if task %}
                    Update Task
                {% else %}
                    Create Task
                {% endif %}
            </button>
        </form>

        <br>

        <a href="{% url 'task_list' %}" class = "btn btn-primary" role="button">
            Back to Tasks
        </a>
    </div>
{% endblock %}
