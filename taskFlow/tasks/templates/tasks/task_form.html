<!DOCTYPE html>
<html>
<head>

    <title>
        {% if task %}
            Edit Task
        {% else %}
            Create Task
        {% endif %}
        - TaskFlow
    </title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="container" style="background-color: #738383;">

    <h1>
        {% if task %}
            Edit Task
        {% else %}
            Create New Task
        {% endif %}
    </h1>


    <form method="POST">

        {% csrf_token %}


        <label for="title">
            Title:
        </label>

        <br>

        <input
            type="text"
            id="title"
            name="title"
            maxlength="200"
            value="{{ task.title|default:'' }}"
            required
        >

        <br><br>


        <label for="description">
            Description:
        </label>

        <br>

        <textarea
            id="description"
            name="description"
            rows="5"
            cols="40"
        >{{ task.description|default:'' }}</textarea>

        <br><br>


        <label for="priority">
            Priority:
        </label>

        <br>

        <select id="priority" name="priority">

            <option
                value="low"
                {% if task.priority == 'low' %}selected{% endif %}
            >
                Low
            </option>

            <option
                value="medium"
                {% if task.priority == 'medium' or not task %}selected{% endif %}
            >
                Medium
            </option>

            <option
                value="high"
                {% if task.priority == 'high' %}selected{% endif %}
            >
                High
            </option>

        </select>

        <br><br>


        <label for="due_date">
            Due Date:
        </label>

        <br>

        <input
            type="date"
            id="due_date"
            name="due_date"
            value="{{ task.due_date|date:'Y-m-d' }}"
        >

        <br><br>

        {% comment %} <button type="button" class="btn btn-success">Success</button> {% endcomment %}
        <button type="submit" class="btn btn-success">

            {% if task %}
                Update Task
            {% else %}
                Create Task
            {% endif %}

        </button>

    </form>


    <br>
    
    <a href="{% url 'task_list' %}" class="btn btn-primary"role ="button"> 
        Back to Tasks
    </a>

</body>
</html>
