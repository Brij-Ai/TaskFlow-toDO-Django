{% extends 'home.html' %}

{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <!-- Page Heading -->
            <div class="text-center mb-5">
                <h1 class="fw-bold">Contact Us</h1>
                <p class="text-muted">
                    Have a question, suggestion, or feedback? We'd love to hear from you.
                </p>
            </div>

            <!-- Contact Form -->
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">

                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input
                                type="text"
                                class="form-control"
                                id="name"
                                name="name"
                                placeholder="Enter your name"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                name="email"
                                placeholder="Enter your email"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="subject" class="form-label">Subject</label>
                            <input
                                type="text"
                                class="form-control"
                                id="subject"
                                name="subject"
                                placeholder="What is this about?"
                                required
                            >
                        </div>

                        <div class="mb-4">
                            <label for="message" class="form-label">Message</label>
                            <textarea
                                class="form-control"
                                id="message"
                                name="message"
                                rows="5"
                                placeholder="Write your message..."
                                required
                            ></textarea>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">
                                Send Message
                            </button>
                        </div>

                    </form>

                </div>
            </div>

            <!-- Contact Information -->
            <div class="row text-center mt-5">

                <div class="col-md-4 mb-3">
                    <div class="fs-3">📧</div>
                    <h6 class="fw-bold mt-2">Email</h6>
                    <p class="text-muted mb-0">support@taskflow.com</p>
                </div>

                <div class="col-md-4 mb-3">
                    <div class="fs-3">📍</div>
                    <h6 class="fw-bold mt-2">Location</h6>
                    <p class="text-muted mb-0">India</p>
                </div>

                <div class="col-md-4 mb-3">
                    <div class="fs-3">💬</div>
                    <h6 class="fw-bold mt-2">Support</h6>
                    <p class="text-muted mb-0">We're here to help</p>
                </div>

            </div>

        </div>
    </div>
</div>

{% endblock %}
