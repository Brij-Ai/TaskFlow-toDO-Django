<!doctype html>
<html>
  <head>
    <title>Delete Task - TaskFlow</title>
  </head>

  <body>
    <h1>Delete Task</h1>

    <p>Are you sure you want to delete this task?</p>

    <h3>{{ task.title }}</h3>

    <p>{{ task.description }}</p>

    <form method="POST">
      {% csrf_token %}

      <button type="submit">Yes, Delete</button>

      <a href="{% url 'task_list' %}"> Cancel </a>
    </form>
  </body>
</html>
