{% extends 'home.html' %}
{% load static %}

{% block title %}{{user.username}}'s Dashboard{% endblock %}

{% block content %}
    
    <!-- Statistics Section -->
<div class="container py-4" style="font-family: Arial, sans-serif; color: #615d5d;">

    <div class="row justify-content-center g-4" style="margin-top: 50px;">

        <div class="col-12 col-sm-6 col-lg-3">
            <div class="card shadow-sm border-0 text-center">
                <div class="card-body">
                    <p class="text-muted mb-2">Total Tasks</p>
                    <h2 class="fw-bold mb-0">{{ total_tasks }}</h2>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-lg-3">
            <div class="card shadow-sm border-0 text-center">
                <div class="card-body">
                    <p class="text-muted mb-2">Pending</p>
                    <h2 class="fw-bold mb-0">{{ pending_tasks }}</h2>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-lg-3">
            <div class="card shadow-sm border-0 text-center">
                <div class="card-body">
                    <p class="text-muted mb-2">Completed</p>
                    <h2 class="fw-bold mb-0">{{ completed_tasks }}</h2>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-lg-3">
            <div class="card shadow-sm border-0 text-center">
                <div class="card-body">
                    <p class="text-muted mb-2">Completion Rate</p>
                    <h2 class="fw-bold mb-0">{{ completion_percentage }}%</h2>
                </div>
            </div>
        </div>

    </div>

</div>
{% endblock %}
